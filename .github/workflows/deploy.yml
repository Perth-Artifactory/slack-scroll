name: Deploy to Raspberry Pi via Teleport

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Teleport
        uses: teleport-actions/setup@v1
        with:
          version: latest
      
      - name: Authenticate with Teleport
        uses: teleport-actions/auth@v2
        with:
          proxy: ${{ secrets.TELEPORT_PROXY }}
          token: ${{ secrets.TELEPORT_TOKEN }}
          # Optional: specify certificate TTL
          # certificate-ttl: 1h
      
      - name: Deploy to Raspberry Pi
        run: |
          set -e
          echo "Starting deployment via Teleport..."
          tsh ssh ${{ secrets.TELEPORT_USER }}@${{ secrets.TELEPORT_NODE }} << 'REMOTESCRIPT'
            set -e
            echo "Connected via Teleport, starting deployment..."
            cd ~/slackscroll
            ./scripts/update.sh
            echo "Deployment complete!"
          REMOTESCRIPT
      
      - name: Verify deployment
        run: |
          tsh ssh ${{ secrets.TELEPORT_USER }}@${{ secrets.TELEPORT_NODE }} << 'REMOTESCRIPT'
            if sudo systemctl is-active --quiet slack-scroll; then
              echo "✓ Service is running"
              sudo systemctl status slack-scroll --no-pager
            else
              echo "✗ Service is not running!"
              sudo journalctl -u slack-scroll --no-pager -n 20
              exit 1
            fi
          REMOTESCRIPT
      
      - name: Cleanup Teleport
        if: always()
        run: tsh logout || true
